<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e9d5ff"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
  </defs>
  <rect fill="url(#sky)" width="800" height="500"/>
  <!-- Building silhouette -->
  <rect x="150" y="150" width="200" height="350" fill="#7e22ce" opacity="0.8"/>
  <rect x="370" y="100" width="180" height="400" fill="#6b21a8" opacity="0.85"/>
  <rect x="570" y="200" width="100" height="300" fill="#9333ea" opacity="0.75"/>
  <!-- Windows -->
  <g fill="#ffffff" opacity="0.6">
    <rect x="180" y="180" width="30" height="40" rx="2"/>
    <rect x="230" y="180" width="30" height="40" rx="2"/>
    <rect x="280" y="180" width="30" height="40" rx="2"/>
    <rect x="180" y="250" width="30" height="40" rx="2"/>
    <rect x="230" y="250" width="30" height="40" rx="2"/>
    <rect x="280" y="250" width="30" height="40" rx="2"/>
    <rect x="180" y="320" width="30" height="40" rx="2"/>
    <rect x="230" y="320" width="30" height="40" rx="2"/>
    <rect x="280" y="320" width="30" height="40" rx="2"/>
    <rect x="400" y="130" width="30" height="40" rx="2"/>
    <rect x="450" y="130" width="30" height="40" rx="2"/>
    <rect x="500" y="130" width="30" height="40" rx="2"/>
    <rect x="400" y="200" width="30" height="40" rx="2"/>
    <rect x="450" y="200" width="30" height="40" rx="2"/>
    <rect x="500" y="200" width="30" height="40" rx="2"/>
    <rect x="400" y="270" width="30" height="40" rx="2"/>
    <rect x="450" y="270" width="30" height="40" rx="2"/>
    <rect x="500" y="270" width="30" height="40" rx="2"/>
  </g>
  <!-- Ground -->
  <rect x="0" y="450" width="800" height="50" fill="#3f3f46"/>
  <!-- Text -->
  <text x="400" y="480" text-anchor="middle" fill="#ffffff" font-family="serif" font-size="16" opacity="0.8">Classic Apartment Buildings</text>
</svg>
