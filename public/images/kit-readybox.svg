<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect fill="#f3e8ff" width="400" height="400"/>
  <!-- Box -->
  <rect x="100" y="120" width="200" height="160" fill="#7e22ce" opacity="0.6" rx="4"/>
  <rect x="100" y="120" width="200" height="40" fill="#6b21a8" opacity="0.7" rx="4"/>
  <!-- Contents peeking out -->
  <rect x="140" y="100" width="20" height="40" fill="#d8b4fe" rx="2"/>
  <rect x="180" y="90" width="15" height="50" fill="#d8b4fe" rx="2"/>
  <rect x="220" y="95" width="25" height="45" fill="#d8b4fe" rx="2"/>
  <!-- Label -->
  <rect x="150" y="180" width="100" height="40" fill="#ffffff" opacity="0.8" rx="2"/>
  <text x="200" y="205" text-anchor="middle" fill="#7e22ce" font-size="12" font-weight="bold">BRAVE LISTINGS</text>
  <!-- Text -->
  <text x="200" y="370" text-anchor="middle" fill="#6b21a8" font-family="serif" font-size="16">First Month Ready Box</text>
</svg>
