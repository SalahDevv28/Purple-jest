<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <rect fill="#e9d5ff" width="600" height="400"/>
  <!-- Theatre district backdrop -->
  <rect x="50" y="50" width="500" height="250" fill="#7e22ce" opacity="0.3" rx="4"/>
  <!-- Marquee -->
  <rect x="150" y="80" width="300" height="60" fill="#9333ea" opacity="0.5" rx="4"/>
  <text x="300" y="118" text-anchor="middle" fill="#ffffff" font-family="serif" font-size="20">THEATRE DISTRICT</text>
  <!-- Stage door -->
  <rect x="250" y="180" width="100" height="120" fill="#6b21a8" opacity="0.6" rx="2"/>
  <circle cx="330" cy="240" r="5" fill="#d8b4fe"/>
  <!-- Bookshelves -->
  <g fill="#581c87" opacity="0.4">
    <rect x="80" y="200" width="60" height="100"/>
    <rect x="460" y="200" width="60" height="100"/>
  </g>
  <!-- Text -->
  <text x="300" y="380" text-anchor="middle" fill="#6b21a8" font-family="serif" font-size="18">The Jestmaker's Nook</text>
</svg>
