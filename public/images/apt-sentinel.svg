<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <rect fill="#f3e8ff" width="600" height="400"/>
  <!-- Lighthouse -->
  <rect x="270" y="50" width="60" height="200" fill="#9333ea" opacity="0.5"/>
  <circle cx="300" cy="50" r="40" fill="#7e22ce" opacity="0.6"/>
  <!-- Light beams -->
  <line x1="300" y1="50" x2="100" y2="20" stroke="#d8b4fe" stroke-width="3" opacity="0.5"/>
  <line x1="300" y1="50" x2="500" y2="20" stroke="#d8b4fe" stroke-width="3" opacity="0.5"/>
  <line x1="300" y1="50" x2="50" y2="80" stroke="#d8b4fe" stroke-width="3" opacity="0.4"/>
  <line x1="300" y1="50" x2="550" y2="80" stroke="#d8b4fe" stroke-width="3" opacity="0.4"/>
  <!-- Panoramic view suggestion -->
  <rect x="50" y="280" width="500" height="80" fill="#e9d5ff" opacity="0.5" rx="4"/>
  <!-- Gas fireplace -->
  <rect x="250" y="200" width="100" height="80" fill="#6b21a8" opacity="0.4" rx="4"/>
  <circle cx="300" cy="240" r="15" fill="#c084fc" opacity="0.6"/>
  <!-- Text -->
  <text x="300" y="380" text-anchor="middle" fill="#6b21a8" font-family="serif" font-size="18">The Sentinel Suite</text>
</svg>
