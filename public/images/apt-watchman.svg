<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <rect fill="#f3e8ff" width="600" height="400"/>
  <!-- Stained glass window -->
  <circle cx="300" cy="180" r="100" fill="#d8b4fe" opacity="0.6"/>
  <circle cx="300" cy="180" r="80" fill="#c084fc" opacity="0.4"/>
  <line x1="300" y1="80" x2="300" y2="280" stroke="#7e22ce" stroke-width="2" opacity="0.5"/>
  <line x1="200" y1="180" x2="400" y2="180" stroke="#7e22ce" stroke-width="2" opacity="0.5"/>
  <line x1="230" y1="110" x2="370" y2="250" stroke="#7e22ce" stroke-width="2" opacity="0.5"/>
  <line x1="370" y1="110" x2="230" y2="250" stroke="#7e22ce" stroke-width="2" opacity="0.5"/>
  <!-- Corner unit suggestion -->
  <rect x="50" y="50" width="150" height="300" fill="#e9d5ff" opacity="0.5"/>
  <rect x="400" y="50" width="150" height="300" fill="#e9d5ff" opacity="0.5"/>
  <!-- Text -->
