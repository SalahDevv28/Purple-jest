<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect fill="#e9d5ff" width="400" height="400"/>
  <!-- Mug -->
  <rect x="130" y="120" width="140" height="160" fill="#ffffff" opacity="0.8" rx="8"/>
  <!-- Handle -->
  <path d="M270 160 Q310 160 310 200 Q310 240 270 240" fill="none" stroke="#ffffff" stroke-width="12" opacity="0.8"/>
  <!-- Handshake illustration -->
  <path d="M160 180 L190 180 L200 170 L210 180 L240 180" fill="none" stroke="#7e22ce" stroke-width="4"/>
  <path d="M160 200 L190 200 L200 190 L210 200 L240 200" fill="none" stroke="#7e22ce" stroke-width="4"/>
  <!-- Text inside mug -->
  <text x="200" y="250" text-anchor="middle" fill="#7e22ce" font-size="10" font-style="italic">A deal is a deal</text>
  <!-- Text -->
  <text x="200" y="370" text-anchor="middle" fill="#6b21a8" font-family="serif" font-size="16">Handshake Mug</text>
</svg>
