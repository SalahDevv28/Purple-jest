<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <rect fill="#faf5ff" width="600" height="400"/>
  <!-- Studio layout -->
  <rect x="100" y="80" width="400" height="250" fill="#f3e8ff" opacity="0.7" rx="4"/>
  <!-- Murphy bed -->
  <rect x="150" y="120" width="120" height="80" fill="#d8b4fe" opacity="0.5" rx="2"/>
  <text x="210" y="165" text-anchor="middle" fill="#7e22ce" font-size="12" opacity="0.7">Murphy Bed</text>
  <!-- Kitchen area -->
  <rect x="350" y="120" width="100" height="80" fill="#e9d5ff" opacity="0.6" rx="2"/>
  <text x="400" y="165" text-anchor="middle" fill="#7e22ce" font-size="12" opacity="0.7">Kitchen</text>
  <!-- Tin ceiling pattern -->
  <g fill="#c084fc" opacity="0.3">
    <rect x="120" y="90" width="30" height="30"/>
    <rect x="160" y="90" width="30" height="30"/>
    <rect x="200" y="90" width="30" height="30"/>
    <rect x="240" y="90" width="30" height="30"/>
    <rect x="280" y="90" width="30" height="30"/>
    <rect x="320" y="90" width="30" height="30"/>
    <rect x="360" y="90" width="30" height="30"/>
    <rect x="400" y="90" width="30" height="30"/>
    <rect x="440" y="90" width="30" height="30"/>
  </g>
  <!-- Text -->
  <text x="300" y="380" text-anchor="middle" fill="#6b21a8" font-family="serif" font-size="18">The Steadfast Studio</text>
</svg>
