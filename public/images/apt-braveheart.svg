<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <rect fill="#f3e8ff" width="600" height="400"/>
  <!-- Duplex structure -->
  <rect x="100" y="100" width="180" height="220" fill="#9333ea" opacity="0.6" rx="4"/>
  <rect x="320" y="100" width="180" height="220" fill="#7e22ce" opacity="0.6" rx="4"/>
  <!-- Upper/Lower division -->
  <line x1="100" y1="210" x2="280" y2="210" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
  <line x1="320" y1="210" x2="500" y2="210" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
  <!-- Private entrance -->
  <rect x="160" y="250" width="40" height="70" fill="#581c87" opacity="0.7" rx="2"/>
  <rect x="380" y="250" width="40" height="70" fill="#581c87" opacity="0.7" rx="2"/>
  <!-- Backyard patio -->
  <rect x="100" y="330" width="400" height="40" fill="#d8b4fe" opacity="0.4" rx="4"/>
  <!-- Text -->
  <text x="300" y="380" text-anchor="middle" fill="#6b21a8" font-family="serif" font-size="18">The Braveheart Duplex</text>
</svg>
